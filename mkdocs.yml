site_name: pytest-concurrency
site_description: A pytest plugin for parallel test execution with configurable concurrency
site_url: https://qarium.github.io/pytest-concurrency/
repo_url: https://github.com/qarium/pytest-concurrency
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Usage: usage.md
  - API: api.md
  - Configuration: configuration.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
